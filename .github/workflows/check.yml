name: Exact frozen replay
on: [push, pull_request, workflow_dispatch]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: sh code/replay.sh
      - run: python -O code/build_supplement.py --check
      - run: python -O code/frozen_check.py
      - run: python code/criterion_route2.py 18888871 /tmp/residual.txt && cmp data/residual.txt /tmp/residual.txt
